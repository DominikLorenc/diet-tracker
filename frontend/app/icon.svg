<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Progress-chart mark: same look as MeasurementChart (square dots, last one in accent) -->
  <rect width="512" height="512" fill="#f6f4ee"/>
  <!-- Dashed grid lines -->
  <g stroke="#111111" stroke-width="4" stroke-dasharray="6 12">
    <line x1="120" y1="180" x2="392" y2="180"/>
    <line x1="120" y1="260" x2="392" y2="260"/>
  </g>
  <polyline points="146,214 222,286 300,248 366,330" fill="none" stroke="#111111" stroke-width="22" stroke-linejoin="miter"/>
  <rect x="128" y="196" width="36" height="36" fill="#ffffff" stroke="#111111" stroke-width="10"/>
  <rect x="204" y="268" width="36" height="36" fill="#ffffff" stroke="#111111" stroke-width="10"/>
  <rect x="282" y="230" width="36" height="36" fill="#ffffff" stroke="#111111" stroke-width="10"/>
  <rect x="340" y="304" width="52" height="52" fill="#c8321f"/>
  <!-- Axis -->
  <rect x="112" y="380" width="288" height="16" fill="#111111"/>
</svg>
